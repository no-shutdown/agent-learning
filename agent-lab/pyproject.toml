[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab"
version = "0.1.0"
description = "Learner-owned business Agent scaffold"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_lab = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Gradual typing: enforce application boundaries and neutral model/runtime contracts.
[tool.mypy]
python_version = "3.13"
files = ["src/agent_lab/main.py", "src/agent_lab/models/contracts.py", "src/agent_lab/runtime/loop.py", "src/agent_lab/runtime/contracts.py"]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
