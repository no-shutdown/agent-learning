{% extends 'shop/base.html' %}{% block content %}<a href="/products/">← 返回商品列表</a><div class="heading"><div><div class="eyebrow">{{ product.category }}</div><h1>{{ product.name }}</h1></div><strong>¥{{ product.price }}</strong></div><div class="two-col"><section class="card"><div class="product-art art-a"><b>{{ product.name|slice:':1' }}</b></div><h2>商品介绍</h2><p>{{ product.description }}</p><p>当前库存：{{ product.stock }}</p><p class="muted">本地演示商品，不产生真实支付或配送。</p></section><section class="card"><h2>创建订单</h2><form data-api="/api/v1/orders" data-kind="order" data-confirm="确认创建这笔模拟订单？" data-redirect="order"><input name="product_id" type="hidden" value="{{ product.id }}"><label>收货地址<select name="address_id" required><option value="">请选择</option>{% for a in addresses %}<option value="{{ a.id }}">{{ a.recipient }} · {{ a.city }} {{ a.detail }}</option>{% endfor %}</select></label><label>数量<input name="quantity" type="number" value="1" min="1" max="99" required></label><button {% if not product.stock or not addresses %}disabled{% endif %}>创建订单</button></form><p><a href="/addresses/">管理收货地址 →</a></p></section></div>{% endblock %}
