<label>商品名称<input name="name" value="{{ p.name }}" maxlength="100" required></label><label>分类<input name="category" value="{{ p.category }}" maxlength="30" required></label><label>描述<textarea name="description" maxlength="1000">{{ p.description }}</textarea></label><div class="region"><label>价格<input name="price" type="number" step="0.01" min="0.01" value="{{ p.price }}" required></label><label>库存<input name="stock" type="number" min="0" max="1000000" value="{{ p.stock|default:0 }}" required></label></div><label class="check"><input name="active" type="checkbox" {% if p.active or not p %}checked{% endif %}>上架</label>
