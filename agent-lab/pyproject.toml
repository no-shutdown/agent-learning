[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab"
version = "0.1.0"
description = "Learner-owned business Agent scaffold"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_lab = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Check all application source; retain stricter annotation requirements at core boundaries.
[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["agent_lab.main", "agent_lab.models.contracts", "agent_lab.runtime.loop", "agent_lab.runtime.contracts"]
disallow_untyped_defs = true
