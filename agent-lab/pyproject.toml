[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lab"
version = "0.1.0"
description = "Learner-owned business Agent scaffold"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_lab = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
