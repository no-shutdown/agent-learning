<label>收货人<input name="recipient" value="{{ a.recipient }}" maxlength="40" required></label><label>手机号<input name="phone" type="tel" inputmode="tel" autocomplete="tel" value="{{ a.phone }}" pattern="1[0-9]{10}" maxlength="11" required></label><div class="region"><label>省份<input name="province" value="{{ a.province }}" maxlength="30" required></label><label>城市<input name="city" value="{{ a.city }}" maxlength="30" required></label><label>区县<input name="district" value="{{ a.district }}" maxlength="30" required></label></div><label>详细地址<input name="detail" value="{{ a.detail }}" maxlength="150" required></label>
