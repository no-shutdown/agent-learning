{% if page.paginator.num_pages > 1 %}<div class="pagination">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">← 上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页 · 共 {{ page.paginator.count }} 条</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&q={{ request.GET.q|urlencode }}&status={{ request.GET.status|urlencode }}">下一页 →</a>{% endif %}</div>{% endif %}
